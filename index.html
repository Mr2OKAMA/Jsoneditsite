<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Portal</title>
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-button" id="menu-button" type="button" aria-label="メニューを開閉">☰</button>
    <a class="github-mark" href="#home" aria-label="ポータルホーム">●</a>
    <a class="brand" href="#home">Office Portal <span>/ Dashboard</span></a>
    <form class="global-search" id="global-search" role="search">
      <input id="global-search-input" type="search" placeholder="ポータルを検索…" aria-label="ポータルを検索">
      <span class="search-key">/</span>
    </form>
    <div class="header-actions" aria-label="ヘッダー操作">
      <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="ライトモードに切り替え">ダーク</button>
      <a class="header-action" href="#" aria-label="通知">♢</a>
      <a class="header-action" href="#" aria-label="ヘルプ">?</a>
      <a class="avatar" href="#" aria-label="アカウント">OP</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <p class="sidebar-heading">Office Portal <small>▾</small></p>
      <input class="side-search" id="side-search" type="search" placeholder="メニューを検索…" aria-label="メニューを検索">
      <nav aria-label="ポータルメニュー">
        <ul class="side-list" id="side-list"></ul>
      </nav>
      <p class="side-note">リンク先はSharePointのページURLに差し替えてご利用ください。</p>
    </aside>

    <main class="content">
      <div class="content-inner">
        <div class="breadcrumb">Office Portal <span>/</span> <strong id="breadcrumb-label">Dashboard</strong></div>
        <h1 id="page-title">Dashboard</h1>
        <p class="lead" id="page-lead">事務所の業務情報と各種ツールへ、ここからアクセスできます。</p>
        <div class="content-toolbar">
          <strong id="shortcut-heading">ホームのショートカット</strong>
          <span id="result-count">1 links</span>
        </div>
        <div class="portal-grid" id="portal-grid">
        </div>
        <p class="empty-state" id="empty-state">一致するショートカットがありません。</p>
        <footer>© 2026 Office Portal · Internal use only</footer>
      </div>
    </main>
  </div>
  <script src="data/categories.js"></script>
  <script src="data/cards.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
